# ========================================
# RDVAULT - Fichier de configuration exemple
# ========================================
# Ce fichier peut etre utilise pour une installation silencieuse:
#   RDVault-Setup.exe /S /CONFIG=C:\chemin\vers\config.cfg
#
# Les lignes commencant par # sont des commentaires et sont ignorees.
# Tous les parametres sont obligatoires.

# URL du serveur HashiCorp Vault (avec le port)
VAULT_URL=https://vault.entreprise.local:8200

# Chemin d'authentification LDAP dans Vault
# Par defaut: auth/ldap
LDAP_AUTH_PATH=auth/ldap

# Domaines SSL de confiance (certificats auto-signes acceptes)
# Separes par des virgules, sans espaces
# Inclure toujours localhost et 127.0.0.1 pour le developpement local
TRUSTED_DOMAINS=vault.entreprise.local,10.0.0.50,localhost,127.0.0.1
