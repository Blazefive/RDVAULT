# ========================================
# RDVAULT - Fichier de configuration exemple
# ========================================
# Ce fichier peut etre utilise pour une installation silencieuse:
#   "RDVAULT Setup x.x.x.exe" /S /CONFIG=C:\chemin\vers\config.cfg
#   "RDVAULT Setup x.x.x.exe" /S /CONFIG="C:\chemin avec espaces\config.cfg"
# Il est copie TEL QUEL dans le dossier d'installation (toutes les cles, dont
# TRUSTED_CERT_FINGERPRINTS et LANG) ; l'application valide chaque valeur au demarrage.
# Chemin relatif : relatif au dossier de l'installeur.
# /MODE=local|enterprise, s'il est aussi fourni, remplace seulement la ligne APP_MODE.
# Fichier illisible ou /MODE= invalide : l'installation silencieuse s'arrete (code 2) sans rien modifier.
# Mise a jour sans /CONFIG= : le config.cfg existant est conserve tel quel.
#
# Emplacements lus (par ordre de priorite, mode installe) :
#   1. %PROGRAMDATA%\RDVAULT\config.cfg   (recommande en entreprise : ecriture reservee aux administrateurs)
#   2. <dossier d'installation>\config.cfg
#   3. %APPDATA%\RDVAULT\config.cfg
#
# Les lignes commencant par # sont des commentaires et sont ignorees.

# Mode : enterprise (serveur Vault) ou local (base locale chiffree, hors ligne)
APP_MODE=enterprise

# URL du serveur HashiCorp Vault (https obligatoire, avec le port)
VAULT_URL=https://vault.entreprise.local:8200

# Chemin d'authentification LDAP dans Vault (defaut: auth/ldap)
LDAP_AUTH_PATH=auth/ldap

# Domaines/IP pour lesquels un certificat auto-signe est tolere (separes par des virgules, sans espaces)
# Preferer le deploiement de la CA d'entreprise dans le magasin Windows (GPO) : ce parametre devient alors inutile.
TRUSTED_DOMAINS=vault.entreprise.local,10.0.0.50,localhost,127.0.0.1

# Empreintes SHA-256 des certificats serveur acceptes (pinning, fortement recommande).
# Formats acceptes : hex avec ou sans ":", ou "sha256/<base64>". Plusieurs valeurs separees par des virgules.
# Obtenir l'empreinte : openssl x509 -in vault.crt -noout -fingerprint -sha256
# Portee : l'empreinte est controlee
#   - pour TOUT certificat presente par l'hote exact de VAULT_URL, y compris un certificat reconnu
#     par le magasin Windows (CA publique comme Let's Encrypt, CA d'entreprise, boitier d'inspection TLS) ;
#   - pour les autres domaines de TRUSTED_DOMAINS, seulement quand leur certificat n'est pas reconnu (auto-signe).
# RENOUVELLEMENT : un certificat renouvele a une nouvelle empreinte et serait refuse. Ajoutez sa nouvelle
# empreinte a la liste (a cote de l'ancienne) AVANT de le deployer sur le serveur, puis retirez l'ancienne.
# Avec Let's Encrypt, cela revient tous les 60 a 90 jours (voir DEPLOYMENT.md, Maintenance).
# Si ce parametre est vide, tout certificat auto-signe est accepte pour TRUSTED_DOMAINS (moins sur).
TRUSTED_CERT_FINGERPRINTS=

# URL du proxy RBI pour le partage de sessions (https obligatoire, optionnel)
RBI_PROXY_URL=

# Langue par defaut (en, fr, es, de, ru, zh, pt, it, ja, ko, ar, tr)
LANG=fr
