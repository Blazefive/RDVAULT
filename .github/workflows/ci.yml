name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests rapides (logique pure, pas d'Electron) sur Linux
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Audit des dépendances (non bloquant)
        run: npm audit --omit=dev || true
      - name: Tests React (Jest)
        run: npm run test:react
      - name: Tests unitaires Electron (crypto, hostMatch, …)
        run: npm run test:electron
      - name: Tests passkeys (moteur FIDO2)
        run: npm run test:passkey
      - name: Générer le SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Build + tests de fumée Electron sur Windows (cible principale)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build React
        env:
          CI: false # avertissements lint préexistants non traités comme erreurs
          GENERATE_SOURCEMAP: false
        run: npm run build
      - name: Tests de fumée (coffre local, sync, adversarial, ssh+winrm — userData temporaire)
        run: npm run test:smoke
