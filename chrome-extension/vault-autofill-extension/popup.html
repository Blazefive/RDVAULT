<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Autofill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f9fafb;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 16px;
    }
    .status-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .status-icon.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .status-icon.disconnected {
      background: #ef4444;
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    .status-details {
      font-size: 13px;
      color: #6b7280;
      padding-left: 20px;
    }
    .status-details p {
      margin: 4px 0;
    }
    .status-details strong {
      color: #111827;
    }
    .info-box {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      color: #1e40af;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      padding: 32px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>Vault Autofill</h1>

  <div id="statusCard" class="status-card">
    <div class="status-header">
      <div id="statusIcon" class="status-icon disconnected"></div>
      <div id="statusText" class="status-text">Vérification...</div>
    </div>
    <div id="statusDetails" class="status-details"></div>
  </div>

  <div class="info-box">
    Cette extension nécessite que l'application Desktop Vault soit lancée et connectée.
  </div>

  <script src="popup.js"></script>
</body>
</html>
