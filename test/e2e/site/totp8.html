<!doctype html><html><head><meta charset="utf-8"><title>TOTP 8 chiffres</title></head>
<body><h1>Connexion avec un code TOTP à 8 chiffres sur la même page</h1>
<form id="f" onsubmit="return false;">
  <label>Identifiant <input type="text" name="username" id="u" autocomplete="username"></label><br>
  <label>Mot de passe <input type="password" name="password" id="p" autocomplete="current-password"></label><br>
  <label>Code à usage unique <input type="text" name="otp" id="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="8"></label><br>
  <button type="button" id="go">Valider</button>
</form></body></html>
