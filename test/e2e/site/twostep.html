<!doctype html>
<html><head><meta charset="utf-8"><title>Two-step login</title></head>
<body>
<h1>Two-step login</h1>
<div id="step1">
  <label>Username <input type="text" name="login" id="login" autocomplete="username"></label>
  <button id="next" type="button">Next</button>
</div>
<div id="step2" style="display:none">
  <p>Hello <span id="who"></span></p>
  <label>Password <input type="password" name="pwd" id="pwd" autocomplete="current-password"></label>
  <button id="go" type="button">Sign in</button>
</div>
<pre id="out"></pre>
<script>
next.addEventListener('click', () => {
  who.textContent = login.value;
  step1.style.display = 'none';
  step2.style.display = '';
  pwd.focus();
});
go.addEventListener('click', () => {
  const data = { page: 'twostep', login: login.value, password: pwd.value };
  fetch('/submit', { method: 'POST', body: JSON.stringify(data) }).then(() => { out.textContent = 'submitted'; });
});
</script>
</body></html>
