<!doctype html>
<html><head><meta charset="utf-8"><title>Obfuscated login</title></head>
<body>
<h1>Login (champs aux attributs illisibles)</h1>
<!-- Aucun name/id/autocomplete reconnaissable : seul l'ancrage sur le champ password
     permet de retrouver l'identifiant. Reproduit les sites modernes à attributs hachés. -->
<form id="x7f3a" action="/submit" method="post" onsubmit="return false">
  <div><label>Champ A <input type="text" id="a9b2c1" class="c-9f2"></label></div>
  <div><label>Champ B <input type="password" id="d4e8f0" class="c-7a1"></label></div>
  <button type="button" id="go">Se connecter</button>
</form>
<pre id="out"></pre>
<script>
document.getElementById('go').addEventListener('click', () => {
  const a = document.getElementById('a9b2c1').value;
  const b = document.getElementById('d4e8f0').value;
  fetch('/submit', { method: 'POST', body: JSON.stringify({ page: 'obfuscated', user: a, password: b }) }).then(() => { out.textContent = 'submitted'; });
});
</script>
</body></html>
