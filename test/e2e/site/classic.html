<!doctype html>
<html><head><meta charset="utf-8"><title>Classic login</title></head>
<body>
<h1>Classic login</h1>
<form id="f" method="post" action="/submit">
  <label>Email <input type="email" name="email" id="email" autocomplete="username"></label><br>
  <label>Password <input type="password" name="password" id="password" autocomplete="current-password"></label><br>
  <button type="submit" id="submit">Sign in</button>
</form>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const data = { page: 'classic', email: email.value, password: password.value };
  fetch('/submit', { method: 'POST', body: JSON.stringify(data) }).then(() => { out.textContent = 'submitted'; });
});
</script>
</body></html>
